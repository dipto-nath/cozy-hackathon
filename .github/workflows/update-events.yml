name: Daily Tech Events Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    
    # Required to push commits back to the repo
    permissions:
      contents: write

    # Sets the default folder since your app is in a subfolder
    defaults:
      run:
        working-directory: ./hackathon-aggregator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './hackathon-aggregator/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Run Data Pipeline (Scrape & Normalize)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: npm run pipeline:techevents

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code src/data/techevents.json || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/techevents.json
          git commit -m "🤖 chore: daily tech events update"
          git push
